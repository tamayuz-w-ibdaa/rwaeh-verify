<script>



const SHEET\_CSV =

"https://docs.google.com/spreadsheets/d/1XoncKTIGuDLASZ5pH4dcea0OveKThyWuU4V3ShgUCug/export?format=csv";



const params = new URLSearchParams(window.location.search);

const id = params.get("id");



document.getElementById("productCode").innerText =

id || "-";



document.getElementById("verifyDate").innerText =

new Date().toLocaleString('ar-SA');



async function verifyCode(){



if(!id){

showInvalid();

return;

}



try{



const response = await fetch(SHEET\_CSV);

const csv = await response.text();



const rows = csv.split("\\n");



let found = null;



for(let i=1;i<rows.length;i++){



let cols = rows\[i]

.replace(/\\r/g,"")

.replace(/"/g,"")

.split(",");



if(cols.length >= 4){



let code = cols\[0].trim();



if(code === id){



found = cols;

break;



}



}



}



if(found){



let product = found\[1].trim();

let batch = found\[2].trim();

let status = found\[3].trim();



document.getElementById("productName").innerText =

product;



document.getElementById("batch").innerText =

batch;



if(status.toLowerCase() === "active"){



document.getElementById("verifyTitle").innerHTML =

"✅ شهادة أصالة المنتج<br>Product Authenticity Certificate";



document.getElementById("statusText").innerHTML =

'<span class="status-ok">نشط ومعتمد<br>Active \& Certified</span>';



}

else{



document.getElementById("verifyTitle").innerHTML =

"⚠️ تم إيقاف هذا الكود<br>Verification Code Blocked";



document.getElementById("statusText").innerHTML =

'<span class="status-bad">موقوف<br>Blocked</span>';



}



}

else{



showInvalid();



}



}

catch(error){



document.getElementById("verifyTitle").innerHTML =

"⚠️ تعذر الاتصال بقاعدة البيانات";



}



}

document.getElementById("verifyTitle").innerHTML =

"❌ المنتج غير أصلي أو الكود
